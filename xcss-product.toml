format = 1
product_id = "xscs"

[foundation]
platform_generation = 1
version = "1.0.0"
package = "xscs-foundation"
path = "crates/foundation"

[[components]]
id = "server"
profile = "server-control-plane"
http_adapter = "axum"
web_profile = "web-csr-admin"
capabilities = ["embedded-web",
  "platform-sqlite",
  "admin-persistent",
  "server-runtime",
  "server-health",
  "durable-operations",
  "secret-envelope",
]
