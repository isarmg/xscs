[package]
name = "xscs-web"
version = "0.1.0"
edition = "2024"

[workspace]
exclude = ["vendor/xcss-web"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "=0.8.19", default-features = false, features = ["csr"] }
xcss-web = { path = "vendor/xcss-web" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
send_wrapper = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "History", "Event", "EventTarget", "SubmitEvent", "HtmlInputElement", "HtmlFormElement", "HtmlSelectElement", "FormData", "AbortController", "AbortSignal", "Crypto"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The integrated xcss snapshot owns both CSR runtime and host macros.
[patch.crates-io]
leptos = { path = "vendor/xcss-web/vendor/leptos-csr" }
leptos_macro = { path = "vendor/xcss-web/vendor/leptos-macro-csr" }
