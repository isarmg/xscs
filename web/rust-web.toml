[web]
kind = "spa"
entry = "src/main-xcss-web.js"
dist = "web/dist"
base = "/"

[web.proxies]
"/api" = "http://127.0.0.1:18104"

[aliases]
"@xcss/web/" = "vendor/xcss/"

# Preserve original notices in standalone dist as well as release receipts.
[web.copies]
"assets/LICENSE-xcss-web-core-MIT.txt" = "xcss-web/vendor/xcss-web/vendor/xcss-web-core/LICENSE"
"assets/LICENSE-xcss-web-macro-MIT.txt" = "xcss-web/vendor/xcss-web/vendor/xcss-web-macro/LICENSE"
"assets/LICENSE-xcss-Apache-2.0.txt" = "vendor/xcss/LICENSE"
