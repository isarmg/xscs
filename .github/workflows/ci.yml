name: CI

on:
  push:
    branches: [main, 'codex/client-cli-*']
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  # Keep PR workflows and existing check names present; filter jobs, not triggers.
  scope:
    name: Change scope
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.changes.outputs.run_full }}
    steps:
      - name: Check out the comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select documentation or full validation
        id: changes
        shell: bash
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run_full=true
          base=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" != tag ]]; then
            base="$PUSH_BASE"
          fi
          # Dispatches, release tags, new branches and unavailable history stay full.
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames -z "$base" HEAD > "$RUNNER_TEMP/changed-paths"
            run_full=false
            while IFS= read -r -d '' path; do
              case "$path" in
                # Release/package inputs and safety audits retain full validation.
                docs/releases/* | docs/unsafe*.md | docs/operations.md) run_full=true; break ;;
                README.md | docs/*.md) ;;
                *) run_full=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "Full validation: $run_full"

  source:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce workflow supply-chain policy
        run: python3 scripts/check-workflow-supply-chain.py
      - name: Validate release tooling
        run: |
          python3 -m py_compile scripts/package-release.py
          python3 scripts/test-package-boundary.py
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Enforce the Linux AMD64 Server target boundary
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          gate_binary="${RUNNER_TEMP}/xscs-build-gate"
          gate_stderr="${RUNNER_TEMP}/xscs-build-gate.stderr"
          rustc scripts/server-target-gate.rs -o "$gate_binary"
          if TARGET=aarch64-unknown-linux-gnu "$gate_binary" 2>"$gate_stderr"; then
            echo 'Server build gate accepted an unsupported target.' >&2
            exit 1
          fi
          grep -F \
            'xscs server supports only x86_64-unknown-linux-gnu' \
            "$gate_stderr"
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Prepare embedded browser assets
        run: web/node_modules/.bin/xcss-build-server --config xcss-web-build.json --mode development --web-only --no-install
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check the Server target
        run: cargo check --locked --target x86_64-unknown-linux-gnu --all-targets
      - name: Lint the Server target
        run: cargo clippy --locked --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
      - name: Test Rust and manifest contract
        run: cargo test --locked --target x86_64-unknown-linux-gnu
      - name: Test and lint the product protocol
        run: |
          cargo test --locked -p xscs-protocol
          cargo clippy --locked -p xscs-protocol --all-targets -- -D warnings
      - name: Install browser acceptance engines
        working-directory: web
        run: npx playwright install --with-deps chromium firefox
      - name: Verify instance and remote management UI
        working-directory: web
        run: npm run test:browser
