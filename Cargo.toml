[workspace]
members = ["crates/server", "crates/protocol"]
default-members = ["crates/server"]
resolver = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.99"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/isarmg/xscs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = { version = "1.0.104" }
async-trait = { version = "0.1.92" }
axum = { version = "0.8.9", features = ["ws"] }
base64 = { version = "0.23.1" }
chrono = { version = "0.4.45", features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34" }
hex = { version = "0.4.3" }
hkdf = { version = "0.13.0" }
hmac = { version = "0.13.0" }
http-body-util = { version = "0.1.5" }
rand = { version = "0.10.3" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
xcss = { git = "https://github.com/isarmg/xcss.git", rev = "b34b3861e15edd2b1348e7d03b9c9a93e97d6521", version = "=1.0.0", features = ["tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
sha2 = { version = "0.11.0" }
sqlx = { version = "=0.9.0", default-features = false, features = ["chrono", "derive", "json", "macros", "sqlite-bundled", "runtime-tokio", "uuid"] }
subtle = { version = "=2.6.1" }
xscs-protocol = { path = "crates/protocol", version = "=1.0.0" }
tempfile = { version = "3.27.0" }
thiserror = { version = "2.0.21" }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["serde", "v4"] }
